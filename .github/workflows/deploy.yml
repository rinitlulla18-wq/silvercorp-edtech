name: Build & Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: project-77fd4913-ebb5-4487-9d2
  REGION: asia-south1
  SERVICE: silvercorp-edtech
  IMAGE: asia-south1-docker.pkg.dev/project-77fd4913-ebb5-4487-9d2/silvercorp-repo/silvercorp-edtech

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push Docker image via Cloud Build
        run: |
          gcloud builds submit \
            --project=${{ env.PROJECT_ID }} \
            --tag=${{ env.IMAGE }}:${{ github.sha }} \
            --tag=${{ env.IMAGE }}:latest \
            --timeout=600s \
            .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --service-account=silvercorp-cloudrun-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --add-cloudsql-instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:silvercorp-db \
            --set-env-vars="INSTANCE_CONNECTION_NAME=${{ env.PROJECT_ID }}:${{ env.REGION }}:silvercorp-db,DB_NAME=dashboard,DB_USER=root,DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --quiet

      - name: Print live URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          echo "✅ Live at: $URL"
