name: PR Check (Build Validation)

# Runs on every PR raised against main or development
on:
  pull_request:
    branches: [main, development]

jobs:
  validate:
    name: Validate Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Docker build check
        run: docker build -t silvercorp-pr-check:test .

      - name: ✅ All checks passed
        run: echo "Build is valid — ready for review!"
